name: Gerar APK Android

on:
  push:
    branches:
      - ci/gerar-apk-android
    paths:
      - mobile/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:
    inputs:
      api_host:
        description: IP do computador com o backend, acessivel pelo celular
        required: true
        default: 192.168.0.57
        type: string

permissions:
  contents: read

concurrency:
  group: apk-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      API_HOST: ${{ inputs.api_host || vars.ANDROID_API_HOST || '192.168.0.57' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Baixar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get --enforce-lockfile

      - name: Analisar codigo
        run: flutter analyze

      - name: Executar testes
        run: flutter test --reporter expanded

      - name: Compilar APK de teste
        run: |
          flutter build apk --release --dart-define="API_HOST=$API_HOST"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/grao-cesta-teste.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grao-cesta-android
          path: mobile/build/app/outputs/flutter-apk/grao-cesta-teste.apk
          if-no-files-found: error
          retention-days: 7

      - name: Registrar instrucoes
        run: |
          printf '### APK Android de teste\n\nBaixe o artefato **grao-cesta-android**, extraia o ZIP e instale **grao-cesta-teste.apk** no Android.\n\nBackend configurado: `%s`. Mantenha o computador ligado e o celular na mesma rede.\n\nAPK assinado com a chave de desenvolvimento; destinado a testes locais.\n' "$API_HOST" >> "$GITHUB_STEP_SUMMARY"
