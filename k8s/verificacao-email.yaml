apiVersion: apps/v1
kind: Deployment
metadata:
  name: verificacao-email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verificacao-email
  template:
    metadata:
      labels:
        app: verificacao-email
    spec:
      containers:
        - name: verificacao-email
          image: trabalho-semestral-lp2-verificacao-email:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3014
          envFrom:
            - configMapRef:
                name: lp2-config
            - secretRef:
                name: lp2-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: verificacao-email
spec:
  type: NodePort
  selector:
    app: verificacao-email
  ports:
    - port: 3014
      targetPort: 3014
      nodePort: 30014
