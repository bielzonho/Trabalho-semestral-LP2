apiVersion: apps/v1
kind: Deployment
metadata:
  name: produtos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: produtos
  template:
    metadata:
      labels:
        app: produtos
    spec:
      containers:
        - name: produtos
          image: trabalho-semestral-lp2-produtos:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3012
          envFrom:
            - configMapRef:
                name: lp2-config
            - secretRef:
                name: lp2-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: produtos
spec:
  type: NodePort
  selector:
    app: produtos
  ports:
    - port: 3012
      targetPort: 3012
      nodePort: 30012
