apiVersion: apps/v1
kind: Deployment
metadata:
  name: verificacao-email-dart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verificacao-email-dart
  template:
    metadata:
      labels:
        app: verificacao-email-dart
    spec:
      containers:
        - name: verificacao-email-dart
          image: trabalho-semestral-lp2-verificacao-email-dart:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3016
          envFrom:
            - configMapRef:
                name: lp2-config
            - secretRef:
                name: lp2-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: verificacao-email-dart
spec:
  type: NodePort
  selector:
    app: verificacao-email-dart
  ports:
    - port: 3016
      targetPort: 3016
      nodePort: 30016
