apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: trabalho-semestral-lp2-auth:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3013
          envFrom:
            - configMapRef:
                name: lp2-config
            - secretRef:
                name: lp2-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  type: NodePort
  selector:
    app: auth
  ports:
    - port: 3013
      targetPort: 3013
      nodePort: 30013
