# Modelo do Secret usado pelos microsserviços no Kubernetes.
#
# 1. Copie para k8s/secret.yaml (esse arquivo está no .gitignore e NUNCA deve ser commitado):
#      cp k8s/exemplos/secret.example.yaml k8s/secret.yaml
# 2. Preencha com os mesmos valores do .env da raiz.
# 3. kubectl apply -f k8s/
#
# Este modelo fica em k8s/exemplos/ porque `kubectl apply -f k8s/` (sem -R) não lê
# subpastas — assim ele nunca sobrescreve o Secret real.
apiVersion: v1
kind: Secret
metadata:
  name: lp2-secret
type: Opaque
stringData:
  DB_URL: "https://<projeto>.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "<service-role-key>"
  JWT_SECRET: "<segredo-jwt>"
  # SMTP é opcional: sem SMTP_USER/SMTP_PASS o código OTP aparece no log do pod de verificação.
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  EMAIL_FROM: ""
