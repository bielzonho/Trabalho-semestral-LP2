apiVersion: apps/v1
kind: Deployment
metadata:
  name: barramento-eventos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barramento-eventos
  template:
    metadata:
      labels:
        app: barramento-eventos
    spec:
      containers:
        - name: barramento-eventos
          image: trabalho-semestral-lp2-barramento-eventos:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3015
          envFrom:
            - configMapRef:
                name: lp2-config
            - secretRef:
                name: lp2-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: barramento-eventos
spec:
  type: NodePort
  selector:
    app: barramento-eventos
  ports:
    - port: 3015
      targetPort: 3015
      nodePort: 30015
