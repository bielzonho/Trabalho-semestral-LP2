apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos
          image: trabalho-semestral-lp2-pedidos:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3011
          envFrom:
            - configMapRef:
                name: lp2-config
            - secretRef:
                name: lp2-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos
spec:
  type: NodePort
  selector:
    app: pedidos
  ports:
    - port: 3011
      targetPort: 3011
      nodePort: 30011
