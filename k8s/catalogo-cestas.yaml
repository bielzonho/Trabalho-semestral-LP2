apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-cestas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo-cestas
  template:
    metadata:
      labels:
        app: catalogo-cestas
    spec:
      containers:
        - name: catalogo-cestas
          image: trabalho-semestral-lp2-catalogo-cestas:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3010
          envFrom:
            - configMapRef:
                name: lp2-config
            - secretRef:
                name: lp2-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-cestas
spec:
  type: NodePort
  selector:
    app: catalogo-cestas
  ports:
    - port: 3010
      targetPort: 3010
      nodePort: 30010
