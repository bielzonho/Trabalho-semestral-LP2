<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Grão & Cesta</title>
  <style>
    :root {
      --bg: #e6bb84;
      --card: #fff8f0;
      --gold: #c59d5f;
      --text: #3a2a1a;
      --muted: #7a6a5a;
      --border: #d4b896;
      --shadow: rgba(100,60,20,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
    }

    header {
      background: var(--card);
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      box-shadow: 0 2px 8px var(--shadow);
    }

    header h1 { font-size: 22px; color: var(--text); }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
    }
    nav a:hover { color: var(--gold); }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: var(--card);
      padding: 44px 40px;
      border-radius: 12px;
      box-shadow: 0 6px 24px var(--shadow);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-card h2 {
      margin-bottom: 8px;
      color: var(--text);
      font-size: 24px;
    }

    .login-card p.subtitulo {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: var(--gold); }

    .btn-entrar {
      width: 100%;
      padding: 13px;
      background: var(--gold);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    .btn-entrar:hover { background: #b08840; }
    .btn-entrar:disabled { background: #ccc; cursor: not-allowed; }

    .erro {
      color: #b00;
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 14px;
      display: none;
    }

    .dica {
      margin-top: 22px;
      padding: 14px;
      background: #fdf5e6;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: left;
    }
    .dica p { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .dica code { font-size: 12px; color: var(--text); background: #ede3d3; padding: 2px 6px; border-radius: 4px; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>Grão & Cesta</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html" style="color: var(--gold);">Login</a>
    </nav>
  </header>

  <div class="login-container">
    <div class="login-card">
      <h2>Acessar Conta</h2>
      <p class="subtitulo">Grão & Cesta — Gestão de cestas e pedidos</p>

      <div id="msgErro" class="erro"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="senha" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-entrar" id="btnEntrar">ENTRAR</button>
      </form>

      <div class="dica">
        <p>Contas disponíveis para teste:</p>
        <code>admin@email.com / admin123</code>
        <code>cliente@email.com / cliente123</code>
      </div>
    </div>
  </div>

  <script>
    const API_AUTH = "http://localhost:3013/auth";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const msgErro = document.getElementById("msgErro");
      const btnEntrar = document.getElementById("btnEntrar");

      msgErro.style.display = "none";
      btnEntrar.disabled = true;
      btnEntrar.textContent = "Entrando...";

      try {
        const resposta = await fetch(`${API_AUTH}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, senha })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.mensagem || "Credenciais inválidas.");
        }

        localStorage.setItem("token", dados.token);
        localStorage.setItem("usuario", JSON.stringify(dados.usuario));

        if (dados.usuario.perfil === "admin") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "index.html";
        }

      } catch (err) {
        msgErro.textContent = err.message || "Erro ao realizar login.";
        msgErro.style.display = "block";
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.textContent = "ENTRAR";
      }
    });
  </script>

</body>
</html>
